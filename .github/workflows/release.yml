# Push a tag like v1.0.1 to publish a release.
# The tag must match "version" in extension/manifest.json.
# Asset names have no version, so the README links
# releases/latest/download/youtube-skip.zip and .../download.png
# always get the newest release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match manifest version
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $v" >&2
            exit 1
          fi
      - name: Package
        run: cd extension && zip -X -r ../youtube-skip.zip .
      - name: Draw the README download button for this version
        run: |
          pip install --quiet pillow==12.3.0
          python3 tools/make-button.py --version "${GITHUB_REF_NAME#v}" --out download.png
      - run: gh release create "$GITHUB_REF_NAME" youtube-skip.zip download.png --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
